spring.application.name=StudyStack

# Database (required)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Razorpay Configuration
razorpay.environment=${RAZORPAY_ENVIRONMENT}
razorpay.key_id=${RAZORPAY_KEY_ID}
razorpay.key_secret=${RAZORPAY_KEY_SECRET}

# Razorpay API Configuration
razorpay.api.url=${RAZORPAY_API_URL:https://api.razorpay.com}

# JWT signing key (required)
jwt.key=${JWT_KEY}

# JWT token expiration in milliseconds (default: 1 hour)
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Path for uploading PDFs
file.upload-dir=${PATH_FOR_UPLOADS}

# Url for frontend
frontend.url=${FRONTEND_URL}

# Mail (SMTP) Configuration - used for OTP / transactional email
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
mail.from=${MAIL_FROM:no-reply@studystack.com}

# Inbox that receives contact-form submissions
contact.receiver-email=${CONTACT_RECEIVER_EMAIL:${mail.from:no-reply@studystack.com}}

# Email OTP verification settings
otp.expiry-minutes=${OTP_EXPIRY_MINUTES:10}
otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
otp.max-attempts=${OTP_MAX_ATTEMPTS:5}

# Logging Configuration
# NOTE: security DEBUG logging is verbose and can leak sensitive request
# detail into logs - keep it off outside local debugging.
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
logging.level.root=INFO
logging.level.com.studystack=INFO
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-timeout=30000
