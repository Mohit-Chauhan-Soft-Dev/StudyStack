name: StudyStack CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Backend
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Upload Backend JAR
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/target/StudyStack-1.1.0.jar"
          target: "/home/ec2-user/studystack/backend/app/"
          strip_components: 2

      - name: Restart Backend
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart studystack

            echo "Waiting for backend to start..."

            for i in {1..30}; do
              if curl -fs http://localhost:8080/api/public/users/count >/dev/null; then
                echo "Backend is ready!"
                break
              fi
              sleep 2
            done

            sudo systemctl status studystack --no-pager

            curl http://localhost:8080/api/public/users/count